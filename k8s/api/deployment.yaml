apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-platform
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Replace <registry>/<repo> with your ECR image (see terraform/).
          image: rag-platform-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rag-api-config
          env:
            # Secrets are optional: without them the API runs with the
            # fake clients (offline mode) instead of failing to start.
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-api-secrets
                  key: EMBEDDING_API_KEY
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-api-secrets
                  key: LLM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-platform
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
      name: http
